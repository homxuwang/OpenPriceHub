name = "ai-price-compare"
main = "src/worker/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# 静态资源配置
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# D1 数据库配置
[[d1_databases]]
binding = "DB"
database_name = "ai-price-compare"
database_id = "your-database-id-here"

# KV 命名空间配置
[[kv_namespaces]]
binding = "KV"
id = "your-kv-id-here"

# Local development only. Production configuration is generated from ignored config/*.local.json.
# Administrator credentials belong in .dev.vars locally and Cloudflare Secrets in production.
[vars]
SITE_URL = "http://localhost:3001"
